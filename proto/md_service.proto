syntax = "proto3";

package tevnnis;

import "events.proto";

// §4.3 — Pull interface
service MarketData {
  rpc PullDecisionBatch(PullRequest) returns (PullResponse);
  // Deferred to v0.x: defined but not implemented in v0.
  rpc WakeSignals(WakeRequest) returns (stream WakeEvent);
}

message PullRequest {
  int32           max_events   = 1;   // top-N
  Priority        min_priority = 2;   // only >= this
  repeated string sectors      = 3;   // filter
  string          since_cursor = 4;   // only events after last pull (prevents reprocessing)
}

message PullResponse {
  repeated MarketEvent    events        = 1;   // pre-sorted by priority
  repeated SectorSnapshot snapshots     = 2;   // compact current state (context, not just deltas)
  string                  next_cursor   = 3;   // core stores this, passes back as since_cursor
  int32                   dropped_count = 4;   // events collapsed/dropped this round (observability)
}

message SectorSnapshot {
  string sector = 1;

  message SymbolState {
    string symbol     = 1;
    double last_price = 2;
    double change_pct = 3;
  }

  repeated SymbolState symbols = 2;   // one tiny line per watched symbol; keep token-cheap
}

// Deferred to v0.x — schema locked here so the contract is stable.
message WakeRequest {}

message WakeEvent {
  MarketEvent event = 1;
}
